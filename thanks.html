<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>문의 감사합니다 · 미국주부</title>
<meta name="robots" content="noindex" />
<link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
<link rel="icon" type="image/png" sizes="512x512" href="/favicon.png" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@700;800&family=JetBrains+Mono:wght@500&family=Caveat:wght@600&display=swap" rel="stylesheet" />
<style>
  :root{--cream:#FAF7F2;--ink:#241F1B;--ink2:#6B5D54;--coral:#FF5733;--coral-d:#E8431F;--mustard:#D49E5C;--line:#EBE3D8;
    --kr:'Pretendard Variable',Pretendard,system-ui,sans-serif;--en:'Inter Tight',var(--kr);--mono:'JetBrains Mono',monospace;--hand:'Caveat',cursive;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--cream);color:var(--ink);font-family:var(--kr);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;-webkit-font-smoothing:antialiased;}
  .card{max-width:520px;width:100%;text-align:center;}
  .logo{display:inline-flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);margin-bottom:30px;}
  .logo .mk{width:38px;height:38px;border-radius:10px;background:var(--coral);color:#fff;display:grid;place-items:center;font-family:var(--en);font-weight:800;font-size:19px;}
  .logo b{font-size:17px;letter-spacing:-.02em;}
  .logo .sub{display:block;font-family:var(--mono);font-size:10px;color:var(--ink2);letter-spacing:.08em;text-align:left;}
  .check{width:88px;height:88px;border-radius:50%;background:var(--coral);display:grid;place-items:center;margin:0 auto 22px;box-shadow:0 14px 34px rgba(255,87,51,.32);}
  .check svg{width:46px;height:46px;stroke:#fff;stroke-width:3.5;fill:none;stroke-linecap:round;stroke-linejoin:round;}
  .hand{font-family:var(--hand);font-size:26px;color:var(--mustard);transform:rotate(-3deg);display:inline-block;}
  h1{font-size:clamp(24px,5vw,30px);font-weight:800;letter-spacing:-.02em;margin-top:8px;}
  p.desc{margin-top:14px;font-size:16px;line-height:1.75;color:var(--ink2);}
  .btns{margin-top:30px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}
  .btn{display:inline-flex;align-items:center;gap:8px;font-size:15.5px;font-weight:700;padding:14px 26px;border-radius:999px;text-decoration:none;transition:transform .15s,background .15s;}
  .btn:hover{transform:translateY(-2px);}
  .btn-coral{background:var(--coral);color:#fff;}.btn-coral:hover{background:var(--coral-d);}
  .btn-ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line);}
</style>
</head>
<body>
  <main class="card">
    <a href="/" class="logo" aria-label="미국주부 홈"><span class="mk">M</span><span><b>미국주부</b><span class="sub">MOMPRENEUR DIARY</span></span></a>
    <div class="check"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></div>
    <div class="hand">잘 받았어요!</div>
    <h1>문의가 정상적으로 전송됐어요</h1>
    <p class="desc">소중한 문의 감사합니다.<br />내용 확인 후 <b>보통 24~48시간 안에</b> 메일로 회신드릴게요.<br />조금만 기다려 주세요 😊</p>
    <div class="btns">
      <a href="/" class="btn btn-coral">🏠 홈으로 가기 →</a>
      <a href="https://www.youtube.com/@mikukjubu" target="_blank" rel="noopener" class="btn btn-ghost">▶ 유튜브 보러가기</a>
    </div>
  </main>
</body>
</html>

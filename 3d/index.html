<style>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>

<script>
(function(){
const SITE='https://theuniverseepisodes.com';
const V3=(x,y,z)=>new THREE.Vector3(x,y,z);
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- noise ---------- */
function hash(x,y,z){let h=(Math.imul(x,374761393)+Math.imul(y,668265263)+Math.imul(z,1274126177))|0;
  h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return (h>>>0)/4294967296;}
function noise(x,y,z){const X=Math.floor(x),Y=Math.floor(y),Z=Math.floor(z);let fx=x-X,fy=y-Y,fz=z-Z;
  fx=fx*fx*(3-2*fx);fy=fy*fy*(3-2*fy);fz=fz*fz*(3-2*fz);
  const L=(a,b,t)=>a+(b-a)*t;
  return L(L(L(hash(X,Y,Z),hash(X+1,Y,Z),fx),L(hash(X,Y+1,Z),hash(X+1,Y+1,Z),fx),fy),
           L(L(hash(X,Y,Z+1),hash(X+1,Y,Z+1),fx),L(hash(X,Y+1,Z+1),hash(X+1,Y+1,Z+1),fx),fy),fz);}
function fbm(x,y,z,o){let s=0,a=.5,f=1;for(let i=0;i<o;i++){s+=a*noise(x*f,y*f,z*f);f*=2.03;a*=.5;}return s;}
const mix=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function ramp(stops,t){t=clamp(t,0,1);for(let i=1;i<stops.length;i++){if(t<=stops[i][0]){const k=(t-stops[i-1][0])/(stops[i][0]-stops[i-1][0]);return mix(stops[i-1][1],stops[i][1],k);}}return stops[stops.length-1][1];}

/* equirect texture from a sphere-point function */
function sphereTex(w,h,fn){const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');const img=g.createImageData(w,h);
  for(let j=0;j<h;j++){const lat=(.5-j/h)*Math.PI,cl=Math.cos(lat),y=Math.sin(lat);
    for(let i=0;i<w;i++){const lon=i/w*Math.PI*2,x=cl*Math.cos(lon),z=cl*Math.sin(lon);
      const col=fn(x,y,z,lat,lon);const k=(j*w+i)*4;img.data[k]=col[0];img.data[k+1]=col[1];img.data[k+2]=col[2];img.data[k+3]=col[3]==null?255:col[3];}}
  g.putImageData(img,0,0);const t=new THREE.CanvasTexture(c);t.anisotropy=4;return t;}
function glowTex(stops){const c=document.createElement('canvas');c.width=c.height=256;const g=c.getContext('2d');
  const gr=g.createRadialGradient(128,128,0,128,128,128);stops.forEach(s=>gr.addColorStop(s[0],s[1]));g.fillStyle=gr;g.fillRect(0,0,256,256);return new THREE.CanvasTexture(c);}

/* ---------- renderer ---------- */
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight,false);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x03050b);
const camera=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,.1,6000);
let composer=null,bloom=null;
if(THREE.EffectComposer&&THREE.UnrealBloomPass&&THREE.RenderPass){
  composer=new THREE.EffectComposer(renderer);composer.addPass(new THREE.RenderPass(scene,camera));
  bloom=new THREE.UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),.7,.4,.88);composer.addPass(bloom);}
const controls=new THREE.OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;controls.dampingFactor=.07;controls.enablePan=false;controls.autoRotate=!reduce;controls.autoRotateSpeed=.35;
controls.minDistance=3;controls.maxDistance=700;

scene.add(new THREE.AmbientLight(0x3a4560,.85));
const sunLight=new THREE.PointLight(0xfff1dc,1.6,0,0);scene.add(sunLight);

/* ---------- background ---------- */
(function stars(){const n=9000,pos=new Float32Array(n*3),col=new Float32Array(n*3);
  for(let i=0;i<n;i++){const u=Math.random()*2-1,t=Math.random()*Math.PI*2,r=1400+Math.random()*1600,s=Math.sqrt(1-u*u);
    pos[i*3]=200+r*s*Math.cos(t);pos[i*3+1]=r*u;pos[i*3+2]=r*s*Math.sin(t);
    const k=Math.random(),c=k<.15?[1,.8,.6]:k<.3?[.7,.8,1]:[1,1,1],b=.45+Math.random()*.55;col[i*3]=c[0]*b;col[i*3+1]=c[1]*b;col[i*3+2]=c[2]*b;}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(pos,3));g.setAttribute('color',new THREE.BufferAttribute(col,3));
  const m=new THREE.PointsMaterial({size:10,vertexColors:true,map:glowTex([[0,'rgba(255,255,255,1)'],[.25,'rgba(255,255,255,.8)'],[1,'rgba(255,255,255,0)']]),transparent:true,depthWrite:false,sizeAttenuation:true});
  scene.add(new THREE.Points(g,m));
  [[[-300,260,-900],'rgba(120,70,200,.55)',900],[[700,-200,-1000],'rgba(40,140,170,.45)',1000],[[300,400,900],'rgba(190,60,120,.35)',800],[[1100,100,300],'rgba(80,90,210,.4)',900]]
  .forEach(([p,c,s])=>{const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex([[0,c],[.5,c.replace(/[\d.]+\)$/,'0.12)')],[1,'rgba(0,0,0,0)']]),blending:THREE.AdditiveBlending,depthWrite:false,opacity:.5}));
    sp.position.set(...p);sp.scale.set(s,s,1);scene.add(sp);});})();

/* ---------- bodies ---------- */
const bodies={};const spinners=[];
function place(d,a,y){return V3(d*Math.cos(a),y,d*Math.sin(a));}
function orbitLine(r){const pts=[];for(let i=0;i<=256;i++){const a=i/256*Math.PI*2;pts.push(V3(r*Math.cos(a),0,r*Math.sin(a)));}
  scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),new THREE.LineBasicMaterial({color:0x8fa6d6,transparent:true,opacity:.13})));}
function planet(name,r,pos,tex,opt={}){const m=new THREE.Mesh(new THREE.SphereGeometry(r,96,64),new THREE.MeshStandardMaterial({map:tex,roughness:opt.rough??.9,metalness:0}));
  m.position.copy(pos);m.rotation.x=opt.tilt||0;scene.add(m);bodies[name]={mesh:m,r};spinners.push([m,opt.spin??.05]);return m;}
function atmo(mesh,r,color,power){const mat=new THREE.ShaderMaterial({transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,side:THREE.BackSide,
  uniforms:{c:{value:new THREE.Color(color)},p:{value:power}},
  vertexShader:'varying vec3 vN;varying vec3 vV;void main(){vec4 mv=modelViewMatrix*vec4(position,1.);vN=normalize(normalMatrix*normal);vV=normalize(-mv.xyz);gl_Position=projectionMatrix*mv;}',
  fragmentShader:'uniform vec3 c;uniform float p;varying vec3 vN;varying vec3 vV;void main(){float f=pow(1.-abs(dot(vN,vV)),p);gl_FragColor=vec4(c*f*1.6,f);}'});
  const a=new THREE.Mesh(new THREE.SphereGeometry(r*1.09,64,48),mat);a.position.copy(mesh.position);scene.add(a);return a;}


/* ---------- textures (NASA) ---------- */
const TL=new THREE.TextureLoader();
function tex(p){const t=TL.load(p);t.anisotropy=8;t.encoding=THREE.sRGBEncoding;return t;}
const TX={earth:tex('/3d/tex/earth.jpg'),night:tex('/3d/tex/night.jpg'),clouds:tex('/3d/tex/clouds.jpg'),mars:tex('/3d/tex/mars.jpg'),venus:tex('/3d/tex/venus.jpg'),
  jupiter:tex('/3d/tex/jupiter.jpg'),saturn:tex('/3d/tex/saturn.jpg'),neptune:tex('/3d/tex/neptune.jpg'),moon:tex('/3d/tex/moon.jpg')};
renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.0;
const SUNPOS=V3(0,0,0);

function earthMat(){return new THREE.ShaderMaterial({uniforms:{day:{value:TX.earth},night:{value:TX.night},sun:{value:SUNPOS}},
  vertexShader:`varying vec2 vUv;varying vec3 vN;varying vec3 vW;varying vec3 vV;
    void main(){vUv=uv;vN=normalize(mat3(modelMatrix)*normal);vec4 w=modelMatrix*vec4(position,1.);vW=w.xyz;vV=normalize(cameraPosition-w.xyz);gl_Position=projectionMatrix*viewMatrix*w;}`,
  fragmentShader:`uniform sampler2D day;uniform sampler2D night;uniform vec3 sun;varying vec2 vUv;varying vec3 vN;varying vec3 vW;varying vec3 vV;
    void main(){vec3 L=normalize(sun-vW);float nl=dot(vN,L);float d=smoothstep(-.08,.25,nl);
      vec3 c=texture2D(day,vUv).rgb;vec3 n=texture2D(night,vUv).rgb;
      float ocean=step(length(c-vec3(.06,.13,.30)),.28);
      vec3 H=normalize(L+vV);float spec=pow(max(dot(vN,H),0.),90.)*ocean*.9;
      vec3 lit=c*(.10+.9*d)+vec3(1.,.95,.85)*spec*d;
      vec3 dark=n*vec3(1.2,1.05,.8)*2.2*(1.-d);
      float rim=pow(1.-max(dot(vN,vV),0.),3.)*.55*(.3+.7*d);
      gl_FragColor=vec4(lit+dark+vec3(.35,.6,1.)*rim,1.);}`});}

function build(){
  /* Sun */
  const sunMat=new THREE.ShaderMaterial({uniforms:{t:{value:0}},
    vertexShader:'varying vec3 vP;varying vec3 vN;varying vec3 vV;void main(){vP=position;vN=normalize(normalMatrix*normal);vec4 mv=modelViewMatrix*vec4(position,1.);vV=normalize(-mv.xyz);gl_Position=projectionMatrix*mv;}',
    fragmentShader:`uniform float t;varying vec3 vP;varying vec3 vN;varying vec3 vV;
      vec3 h3(vec3 p){p=vec3(dot(p,vec3(127.1,311.7,74.7)),dot(p,vec3(269.5,183.3,246.1)),dot(p,vec3(113.5,271.9,124.6)));return -1.+2.*fract(sin(p)*43758.5453);}
      float n3(vec3 p){vec3 i=floor(p),f=fract(p),u=f*f*(3.-2.*f);
        return mix(mix(mix(dot(h3(i),f),dot(h3(i+vec3(1,0,0)),f-vec3(1,0,0)),u.x),mix(dot(h3(i+vec3(0,1,0)),f-vec3(0,1,0)),dot(h3(i+vec3(1,1,0)),f-vec3(1,1,0)),u.x),u.y),
          mix(mix(dot(h3(i+vec3(0,0,1)),f-vec3(0,0,1)),dot(h3(i+vec3(1,0,1)),f-vec3(1,0,1)),u.x),mix(dot(h3(i+vec3(0,1,1)),f-vec3(0,1,1)),dot(h3(i+vec3(1,1,1)),f-vec3(1,1,1)),u.x),u.y),u.z);}
      float fbm(vec3 p){float s=0.,a=.5;for(int i=0;i<5;i++){s+=a*n3(p);p=p*2.07+vec3(1.3);a*=.5;}return s;}
      void main(){vec3 p=normalize(vP);float g=fbm(p*3.5+vec3(0.,t*.05,0.));float c=fbm(p*9.+vec3(t*.08));float v=g*.9+c*.5;

const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;

$('prev').onclick=()=>{setAuto(false);goTo(cur-1);};
$('next').onclick=()=>{setAuto(false);goTo(cur+1);};
$('play').onclick=()=>{setAuto(!auto);if(auto&&phase==='dwell')pt=0;};
$('lang').onclick=()=>{lang=lang==='ko'?'en':'ko';fillCard(cur);};
$('clean').onclick=()=>document.body.classList.toggle('clean');
controls.addEventListener('start',()=>setAuto(false));
addEventListener('keydown',e=>{if(e.key===' '){e.preventDefault();$('play').click();}else if(e.key==='ArrowRight')$('next').click();else if(e.key==='ArrowLeft')$('prev').click();else if(e.key==='h'||e.key==='H')$('clean').click();});
if(location.hash.includes('clean'))document.body.classList.add('clean');

/* ---------- sound (Web Audio, 전부 코드로 합성 — 음원 파일 없음) ---------- */
const SND={ctx:null,on:false,master:null,noise:null,pad:null};
function sndInit(){if(SND.ctx)return true;const C=window.AudioContext||window.webkitAudioContext;if(!C)return false;
  const c=new C();SND.ctx=c;const comp=c.createDynamicsCompressor();comp.threshold.value=-20;comp.knee.value=12;comp.ratio.value=5;comp.connect(c.destination);
  SND.master=c.createGain();SND.master.gain.value=0;SND.master.connect(comp);
  const b=c.createBuffer(1,c.sampleRate*2,c.sampleRate),d=b.getChannelData(0);let last=0;
  for(let i=0;i<d.length;i++){const w=Math.random()*2-1;last=(last+.02*w)/1.02;d[i]=w*.35+last*3.5;}
  SND.noise=b;return true;}
function sndLabel(){const s=$('snd');if(!s)return;s.classList.toggle('off',!SND.on);s.setAttribute('aria-pressed',SND.on?'true':'false');
  const nar=innerWidth<=520;s.textContent=SND.on?(nar?'🔊':(lang==='ko'?'🔊 소리 끄기':'🔊 Sound off')):(nar?(lang==='ko'?'🔇 소리':'🔇 Sound'):(lang==='ko'?'🔇 소리 켜기':'🔇 Sound on'));s.title=SND.on?(lang==='ko'?'소리 끄기':'Sound off'):(lang==='ko'?'소리 켜기':'Sound on');}
function sndSet(v){if(!sndInit())return;SND.on=v;const c=SND.ctx;if(c.state!=='running')c.resume();const t=c.currentTime;
  SND.master.gain.cancelScheduledValues(t);SND.master.gain.setTargetAtTime(v?1:0,t,.12);
  if(v){if(phase==='dwell')padStart(STOPS[cur].id);else if(tr)whoosh(Math.max(.8,tr.dur-pt));}else padStop();sndLabel();}
function env(g,t,peak,a,d){g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+a+d);}
/* 이동: 로켓 엔진 저음 + 바람 가르는 쉭 소리 */
function whoosh(dur){if(!SND.on)return;const c=SND.ctx,t=c.currentTime;
  const n=c.createBufferSource();n.buffer=SND.noise;n.loop=true;
  const bp=c.createBiquadFilter();bp.type='bandpass';bp.Q.value=.9;
  bp.frequency.setValueAtTime(160,t);bp.frequency.exponentialRampToValueAtTime(2200,t+dur*.5);bp.frequency.exponentialRampToValueAtTime(240,t+dur);
  const ng=c.createGain();env(ng,t,.75,dur*.45,dur*.55);n.connect(bp);bp.connect(ng);ng.connect(SND.master);n.start(t);n.stop(t+dur+.2);
  const o=c.createOscillator();o.type='sawtooth';o.frequency.setValueAtTime(38,t);o.frequency.linearRampToValueAtTime(64,t+dur*.5);o.frequency.linearRampToValueAtTime(34,t+dur);
  const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=160;const og=c.createGain();env(og,t,.42,dur*.3,dur*.7);
  o.connect(lp);lp.connect(og);og.connect(SND.master);o.start(t);o.stop(t+dur+.2);
  const r=c.createBufferSource();r.buffer=SND.noise;r.loop=true;const rl=c.createBiquadFilter();rl.type='lowpass';rl.frequency.value=120;
  const rg=c.createGain();env(rg,t,.45,dur*.25,dur*.75);r.connect(rl);rl.connect(rg);rg.connect(SND.master);r.start(t);r.stop(t+dur+.2);}
/* 도착: 짧은 종소리 */
function chime(id){if(!SND.on)return;const c=SND.ctx,t=c.currentTime,base={sun:392,earth:523.3,mars:440,jupiter:349.2,saturn:587.3,neptune:659.3,exo:493.9,bh:293.7}[id]||523.3;
  [1,1.5,2.01].forEach((m,i)=>{const o=c.createOscillator();o.type='sine';o.frequency.value=base*m;const g=c.createGain();env(g,t+i*.07,.12/(i+1),.01,1.6);o.connect(g);g.connect(SND.master);o.start(t+i*.07);o.stop(t+i*.07+1.8);});}
/* 행성마다 다른 우주 배경음 */
const PADS={arrive:[55,82.4,110],sun:[36.7,55,73.4],earth:[130.8,164.8,196],mars:[98,116.5,146.8],jupiter:[43.7,65.4,87.3],
  saturn:[146.8,185,220,293.7],neptune:[196,246.9,293.7,392],exo:[110,138.6,164.8],bh:[27.5,29.1,41.2]};
function padStart(id){if(!SND.on)return;padStop();const c=SND.ctx,t=c.currentTime,f=PADS[id]||PADS.arrive;
  const out=c.createGain();out.gain.setValueAtTime(.0001,t);out.gain.exponentialRampToValueAtTime(id==='bh'?.22:.11,t+1.8);
  const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=id==='neptune'?2400:1300;lp.connect(out);out.connect(SND.master);const nodes=[];
  f.forEach((hz,i)=>{const o=c.createOscillator();o.type=i%2?'triangle':'sine';o.frequency.value=hz;o.detune.value=(i-1)*5;
    const lfo=c.createOscillator(),lg=c.createGain();lfo.frequency.value=.07+i*.045;lg.gain.value=4;lfo.connect(lg);lg.connect(o.detune);
    const og=c.createGain();og.gain.value=1/f.length;o.connect(og);og.connect(lp);o.start(t);lfo.start(t);nodes.push(o,lfo);});
  if(id==='sun'){const n=c.createBufferSource();n.buffer=SND.noise;n.loop=true;const bp=c.createBiquadFilter();bp.type='bandpass';bp.frequency.value=700;bp.Q.value=.6;
    const g=c.createGain();g.gain.value=.18;n.connect(bp);bp.connect(g);g.connect(out);n.start(t);nodes.push(n);}
  if(id==='bh'){const o=c.createOscillator();o.type='sine';o.frequency.setValueAtTime(60,t);o.frequency.exponentialRampToValueAtTime(22,t+8);
    const g=c.createGain();g.gain.value=.5;o.connect(g);g.connect(out);o.start(t);nodes.push(o);}
  if(id==='exo'){const o=c.createOscillator();o.type='sine';o.frequency.value=880;const g=c.createGain();g.gain.value=0;
    const lfo=c.createOscillator(),lg=c.createGain();lfo.frequency.value=.95/(Math.PI*2);lg.gain.value=.05;lfo.connect(lg);lg.connect(g.gain);o.connect(g);g.connect(out);o.start(t);lfo.start(t);nodes.push(o,lfo);}
  SND.pad={out,nodes};}
function padStop(){const p=SND.pad;if(!p)return;SND.pad=null;const c=SND.ctx,t=c.currentTime;
  p.out.gain.cancelScheduledValues(t);p.out.gain.setValueAtTime(Math.max(p.out.gain.value,.0002),t);p.out.gain.exponentialRampToValueAtTime(.0001,t+1.1);
  p.nodes.forEach(n=>{try{n.stop(t+1.2);}catch(e){}});}
$('snd').onclick=()=>sndSet(!SND.on);
document.addEventListener('visibilitychange',()=>{if(!SND.ctx)return;if(document.hidden)SND.ctx.suspend();else if(SND.on)SND.ctx.resume();});

/* ---------- labels ---------- */
const LBL={sun:['태양','Sun'],mercury:['수성','Mercury'],venus:['금성','Venus'],earth:['지구','Earth'],moon:['달','Moon'],mars:['화성','Mars'],jupiter:['목성','Jupiter'],saturn:['토성','Saturn'],uranus:['천왕성','Uranus'],neptune:['해왕성','Neptune'],exo:['외계 행성계','Exoplanet system'],bh:['블랙홀','Black hole']};
const labels=[];
function makeLabels(){Object.keys(LBL).forEach(k=>{const el=document.createElement('div');el.className='lbl';document.body.appendChild(el);labels.push({k,el});});}
const tmp=new THREE.Vector3();
function updLabels(){const w=innerWidth,h=innerHeight;labels.forEach(({k,el})=>{const b=bodies[k];if(!b){return;}
  tmp.copy(b.mesh.position);tmp.y+=(b.r||1)*1.35+.4;const dist=camera.position.distanceTo(b.mesh.position);tmp.project(camera);
  const vis=tmp.z<1&&tmp.z>-1&&dist<(cur===0?900:150)&&dist>(b.r||1)*2.2&&!(STOPS[cur].id===k&&phase==='dwell'&&dist<(b.r||1)*6);
  el.textContent=LBL[k][lang==='ko'?0:1];
  el.style.transform=vis?`translate(${(tmp.x*.5+.5)*w}px,${(-tmp.y*.5+.5)*h}px) translate(-50%,-100%)`:'translate(-9999px,0)';});}

/* ---------- transit HUD ---------- */
const lc=$('lc'),lg=lc.getContext('2d'),flux=new Array(250).fill(1);
function drawLC(){lg.clearRect(0,0,500,140);lg.strokeStyle='rgba(190,205,230,.18)';lg.lineWidth=1;lg.beginPath();lg.moveTo(0,30);lg.lineTo(500,30);lg.stroke();
  lg.strokeStyle='#FFB547';lg.lineWidth=3;lg.beginPath();flux.forEach((f,i)=>{const x=i*2,y=30+(1-f)*300;i?lg.lineTo(x,y):lg.moveTo(x,y);});lg.stroke();}

/* ---------- loop ---------- */
const clock=new THREE.Clock();let T=0;
function frame(){const dt=Math.min(clock.getDelta(),.05);T+=dt;
  spinners.forEach(([m,s])=>m.rotation.y+=s*dt);
  const mo=bodies.moon;if(mo&&mo.orbit){mo.orbit.a+=mo.orbit.speed*dt;mo.mesh.position.set(mo.orbit.center.x+Math.cos(mo.orbit.a)*mo.orbit.r,mo.orbit.center.y+Math.sin(mo.orbit.a)*1.2,mo.orbit.center.z+Math.sin(mo.orbit.a)*mo.orbit.r);}
  const pr=bodies.probe;if(pr){const x=((T%8)/8)*2-1,ph=1.45*Math.sin(x*Math.PI/2),r=31/(1+1.6*Math.cos(ph));
    const lp=V3(r*Math.cos(ph),r*Math.sin(ph)*.35,r*Math.sin(ph));lp.applyAxisAngle(V3(0,1,0),2.2);
    pr.mesh.position.copy(pr.center).add(lp);if(x<-.97)pr.hist.length=0;pr.hist.push(pr.mesh.position.clone());if(pr.hist.length>90)pr.hist.shift();
    for(let i=0;i<90;i++){const q=pr.hist[Math.max(0,pr.hist.length-90+i)]||pr.mesh.position;pr.trailPos[i*3]=q.x;pr.trailPos[i*3+1]=q.y;pr.trailPos[i*3+2]=q.z;}
    pr.trail.geometry.attributes.position.needsUpdate=true;}
  const ep=bodies.exoPlanet;if(ep){const a=T*.95;const x=ep.R*Math.cos(a),z=ep.R*Math.sin(a);ep.mesh.position.set(ep.center.x+x,ep.center.y+Math.sin(a)*.6,ep.center.z+z);
    const cover=z>0?clamp((5+1.3-Math.abs(x))/2.6,0,1):0;flux.shift();flux.push(1-cover*.22);}
  const du=bodies.dust;if(du){const c=camera.position,p=du.pos;for(let i=0;i<du.n;i++){for(let k=0;k<3;k++){const v=k==0?c.x:k==1?c.y:c.z;let d=p[i*3+k]-v;if(d>80)p[i*3+k]-=160;else if(d<-80)p[i*3+k]+=160;}}du.mesh.geometry.attributes.position.needsUpdate=true;}
  if(bodies.sun&&bodies.sun.mat)bodies.sun.mat.uniforms.t.value=T;
  const bx=bodies.bhFx;if(bx){bx.diskMat.uniforms.t.value=T;bx.haloMat.uniforms.t.value=T;bx.halo.quaternion.copy(camera.quaternion);
    tmp.subVectors(camera.position,bx.center).normalize();bx.halo.position.copy(bx.center).addScaledVector(tmp,-.8);}

  if(phase==='travel'&&tr){pt+=dt;const k=ease(Math.min(pt/tr.dur,1)),u=1-k;
    camera.position.set(u*u*tr.fromP.x+2*u*k*tr.ctrl.x+k*k*tr.toP.x,u*u*tr.fromP.y+2*u*k*tr.ctrl.y+k*k*tr.toP.y,u*u*tr.fromP.z+2*u*k*tr.ctrl.z+k*k*tr.toP.z);
    controls.target.lerpVectors(tr.fromL,tr.toL,k);camera.lookAt(controls.target);camera.rotateZ(Math.sin(k*Math.PI)*tr.bank);
    if(pt>=tr.dur){phase='dwell';pt=0;controls.enabled=!(inFrame?matchMedia('(pointer: coarse)').matches:false);chime(STOPS[cur].id);padStart(STOPS[cur].id);}}
  else{controls.autoRotate=!reduce;controls.update();if(auto){pt+=dt;if(pt>STOPS[cur].dwell)goTo(cur+1);}}
  const seg=segs.children[cur];if(seg)seg.firstChild.style.width=(phase==='dwell'?clamp(pt/STOPS[cur].dwell,0,1)*100:0)+'%';
  $('transit').style.opacity=(STOPS[cur].hud&&phase==='dwell')?1:0;if(STOPS[cur].hud)drawLC();
  updLabels();
  composer?composer.render():renderer.render(scene,camera);
  requestAnimationFrame(frame);}

addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight,false);if(composer)composer.setSize(innerWidth,innerHeight);});

setTimeout(()=>{build();makeLabels();
  const s0=parseInt((location.hash.match(/s(\d+)/)||[])[1])||1;cur=Math.min(STOPS.length,Math.max(1,s0))-1;const s=STOPS[cur];controls.target.copy(s.tgt());camera.position.copy(s.tgt().add(s.off.clone().multiplyScalar(innerWidth/innerHeight<1?Math.min(1.75,innerHeight/innerWidth*.95):1)));camera.lookAt(controls.target);controls.update();
  fillCard(cur);setAuto(auto);$('loading').classList.add('gone');frame();},30);
})();

name: 최신 영상 갱신

on:
  schedule:
    - cron: '0 * * * *'   # 매시간 (UTC 기준, GitHub 사정으로 몇 분 늦을 수 있음)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: latest-videos
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: RSS에서 최신 3개 읽어 홈 카드 갱신
        run: node .github/scripts/update-videos.mjs

      - name: 바뀐 게 있으면 커밋
        run: |
          if git diff --quiet -- index.html en/index.html; then
            echo "변경 없음 — 커밋 생략"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html en/index.html
          git commit -m "chore: 최신 영상 3개 자동 갱신"
          git push
